eyebrow: "Consultora Estratégica de Marketing"
heroTitle: "NURIA MORALES"
heroClaim: "Antes de hacer más marketing, hay que entender mejor el negocio."
statementLine1: "El marketing no empieza en Instagram."
statementLine2: "Empieza entendiendo el negocio."
problemTitle: "Quizá tu problema no sea hacer más marketing."
problemBody: "Quizá sea no tener claro qué debería estar haciendo tu marketing — y para quién, y por qué ahora mismo y no de cualquier otra forma. Ese es el punto en el que empieza este trabajo."
aboutTitle: "Antes de preguntar qué publicar, me interesa entender qué debería significar la marca."
aboutBody: "Trabajo con negocios que quieren diferenciarse de verdad, no solo verse distintos un trimestre. Mi punto de partida es siempre el negocio: modelo, cliente, posicionamiento, propuesta de valor — el marketing viene después, como consecuencia, no como parche."
finalCtaText: "Si estás buscando una mirada estratégica para entender dónde estás, detectar oportunidades y decidir qué hacer después, hablemos."
