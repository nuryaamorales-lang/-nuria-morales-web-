backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "settings"
    label: "Textos de la Home"
    files:
      - name: "home"
        label: "Textos principales"
        file: "src/content/settings/home.yaml"
        fields:
          - { label: "Foto de fondo del hero", name: "heroImage", widget: "image" }
          - { label: "Etiqueta superior (eyebrow)", name: "eyebrow", widget: "string" }
          - { label: "Título hero (NURIA MORALES)", name: "heroTitle", widget: "string" }
          - { label: "Frase del hero", name: "heroClaim", widget: "text" }
          - { label: "Statement — línea 1", name: "statementLine1", widget: "string" }
          - { label: "Statement — línea 2", name: "statementLine2", widget: "string" }
          - { label: "Título del problema", name: "problemTitle", widget: "string" }
          - { label: "Texto del problema", name: "problemBody", widget: "text" }
          - { label: "Título Sobre mí", name: "aboutTitle", widget: "text" }
          - { label: "Texto Sobre mí", name: "aboutBody", widget: "text" }
          - { label: "Texto del CTA final", name: "finalCtaText", widget: "text" }
      - name: "contacto"
        label: "Email y redes sociales"
        file: "src/content/settings/contacto.yaml"
        fields:
          - { label: "Email de contacto", name: "email", widget: "string" }
          - { label: "URL de LinkedIn", name: "linkedin", widget: "string", required: false, hint: "Déjalo vacío si aún no lo tienes" }
          - { label: "URL de Instagram", name: "instagram", widget: "string", required: false, hint: "Déjalo vacío si aún no lo tienes" }

  - name: "insights"
    label: "Insights (Blog)"
    label_singular: "Artículo"
    folder: "src/content/insights"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options: ["Estrategia", "Branding", "Growth", "AI & Search", "Negocio"]
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Extracto (resumen corto)", name: "excerpt", widget: "text" }
      - { label: "Meta descripción (SEO)", name: "metaDescription", widget: "text" }
      - label: "Servicio relacionado"
        name: "servicioRelacionado"
        widget: "select"
        required: false
        options: ["Strategy", "Positioning & Branding", "Growth & Customer Journey", "AI & Search"]
      - { label: "Imagen de portada", name: "cover", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "proyectos"
    label: "Selected Work"
    label_singular: "Proyecto"
    folder: "src/content/proyectos"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Título del proyecto", name: "title", widget: "string" }
      - { label: "Sector", name: "sector", widget: "string" }
      - label: "Tipo"
        name: "type"
        widget: "select"
        options: ["Client Project", "Strategic Collaboration", "Strategic Analysis", "Practice Project"]
        hint: "Nunca marcar como Client Project si no hubo relación de cliente real."
      - { label: "Resumen (una línea)", name: "summary", widget: "text" }
      - label: "Servicio relacionado"
        name: "servicioRelacionado"
        widget: "select"
        required: false
        options: ["Strategy", "Positioning & Branding", "Growth & Customer Journey", "AI & Search"]
      - { label: "Orden en el listado", name: "order", widget: "number", default: 50 }
      - { label: "Imagen de portada", name: "cover", widget: "image", required: false }
      - { label: "Contenido del caso", name: "body", widget: "markdown" }
